[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knit-core"
version = "0.1.0"
description = "Knit core SDK for step code: state, object store, logging and API calls, with a mock mode for local tests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knit_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
